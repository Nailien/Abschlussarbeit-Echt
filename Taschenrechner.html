<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="Taschenrechner.css">

    <div id="Taschenrechner">
        <input id="anzeige" readonly>
            <div id="knopf">

                <button onclick="rechne(`+`)" class="margin">+</button>
                <button onclick="rechne(`7`)">7</button>
                <button onclick="rechne(`8`)">8</button>
                <button onclick="rechne(`9`)">9</button>
                <button onclick="rechne(`-`)" class="margin">-</button>
                <button onclick="rechne(`4`)">4</button>
                <button onclick="rechne(`5`)">5</button>
                <button onclick="rechne(`6`)">6</button>
                <button onclick="rechne(`*`)" class="margin">*</button>
                <button onclick="rechne(`1`)">1</button>
                <button onclick="rechne(`2`)">2</button>
                <button onclick="rechne(`3`)">3</button>
                <button onclick="rechne(`/`)" class="margin">/</button>
                <button onclick="rechne(`0`)">0</button>
                <button onclick="rechne(`.`)">.</button>
                <button onclick="gleich()">=</button>
                <button onclick="reset()" class="margin">C</button>


            </div>
    </div>

<script src="Taschenrechner.js"></script>
</body>
</html>
